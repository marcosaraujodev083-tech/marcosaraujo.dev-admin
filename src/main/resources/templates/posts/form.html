<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ⚡ SCRIPT ANTI-PISCADA (FOUC PREVENTER) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <title>Editor de Artigo — marcosaraujo.dev admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <!-- EasyMDE -->
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

    <!-- Estilo CSS Externo Isolado -->
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body class="bg-[#f8f9fa] dark:bg-[#121214] text-[#1a1a1a] dark:text-zinc-100 font-sans antialiased max-w-4xl mx-auto px-4 py-8 min-h-screen flex flex-col justify-between transition-colors duration-200">

<div>
    <!-- Cabeçalho do Form -->
    <header class="flex items-center justify-between pb-6 border-b border-gray-200 dark:border-zinc-800 mb-8">
        <div>
            <a href="/" class="text-xs font-mono text-gray-400 dark:text-zinc-500 hover:text-black dark:hover:text-zinc-100 transition mb-1 inline-block">← Voltar para Dashboard</a>
            <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-zinc-100" th:text="${post.id == null ? 'Criar Novo Artigo' : 'Editar Artigo'}">
                Criar Novo Artigo
            </h1>
        </div>

        <!-- Botão Dark Mode (Lâmpada) -->
        <div th:insert="~{fragments/components :: darkModeToggle}"></div>
    </header>

    <!-- Formulário -->
    <main>
        <form id="postForm" th:action="@{/posts}" th:object="${post}" method="post" class="space-y-6">

            <!-- Campo Oculto ID -->
            <input type="hidden" th:field="*{id}" />

            <!-- Título & Slug Automático -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="title" class="block text-xs font-mono text-gray-500 dark:text-zinc-400 mb-1">Título do Artigo</label>
                    <input type="text" id="title" th:field="*{title}" placeholder="Ex: Introdução ao Spring Boot 3" required
                           class="w-full px-3 py-2 border border-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 rounded-lg text-sm focus:outline-none focus:border-black dark:focus:border-zinc-100 transition dark:text-zinc-100">
                </div>

                <div>
                    <label for="slug" class="block text-xs font-mono text-gray-500 dark:text-zinc-400 mb-1">Slug (URL amigável)</label>
                    <input type="text" id="slug" th:field="*{slug}" placeholder="ex: introducao-ao-spring-boot-3"
                           class="w-full px-3 py-2 border border-gray-200 dark:border-zinc-700 rounded-lg text-sm font-mono bg-gray-50 dark:bg-zinc-800/50 focus:outline-none focus:border-black dark:focus:border-zinc-100 transition dark:text-zinc-100">
                </div>
            </div>

            <!-- Resumo (Summary) -->
            <div>
                <label for="summary" class="block text-xs font-mono text-gray-500 dark:text-zinc-400 mb-1">Resumo / Subtítulo</label>
                <textarea id="summary" th:field="*{summary}" rows="2" placeholder="Uma breve descrição sobre o artigo..."
                          class="w-full px-3 py-2 border border-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 rounded-lg text-sm focus:outline-none focus:border-black dark:focus:border-zinc-100 transition dark:text-zinc-100"></textarea>
            </div>

            <!-- Editor Markdown -->
            <div>
                <label for="markdown-editor" class="block text-xs font-mono text-gray-500 dark:text-zinc-400 mb-1">Conteúdo (Markdown)</label>
                <textarea id="markdown-editor" th:field="*{content}"></textarea>
            </div>

            <!-- Opção de Rascunho -->
            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" id="draft" th:field="*{draft}" class="rounded border-gray-300 dark:border-zinc-700 text-black dark:text-zinc-100 focus:ring-black">
                <label for="draft" class="text-xs font-mono text-gray-600 dark:text-zinc-400">Salvar como Rascunho</label>
            </div>

            <!-- Card de Agendamento -->
            <div id="scheduleCard" class="bg-white dark:bg-zinc-900 p-5 border border-gray-200 dark:border-zinc-800 rounded-xl space-y-4 shadow-sm transition-all duration-200">
                <div class="flex items-center justify-between border-b border-gray-100 dark:border-zinc-800 pb-3">
                    <h3 class="text-xs font-bold font-mono text-gray-800 dark:text-zinc-200 uppercase tracking-wider flex items-center gap-1.5">
                        Programação & Agendamento
                    </h3>
                    <span class="text-[11px] font-mono text-gray-400 dark:text-zinc-500">Escolha quando o post vai ao ar</span>
                </div>

                <div id="scheduleInputs" class="space-y-3">
                    <div class="space-y-1">
                        <label for="publishedAt" class="text-xs font-mono text-gray-500 dark:text-zinc-400 block">Data e Hora de Lançamento:</label>
                        <input type="datetime-local"
                               id="publishedAt"
                               name="publishedAt"
                               th:value="${post.publishedAt != null ? #temporals.format(post.publishedAt, 'yyyy-MM-dd''T''HH:mm') : ''}"
                               class="w-full md:w-72 p-2 border border-gray-200 dark:border-zinc-700 rounded-lg text-xs font-mono focus:outline-none focus:border-black dark:focus:border-zinc-100 transition bg-gray-50/50 dark:bg-zinc-800/50 dark:text-zinc-100">
                    </div>

                    <!-- Atalhos Rápidos -->
                    <div class="space-y-1.5">
                        <span class="text-[11px] font-mono text-gray-400 dark:text-zinc-500 block">Atalhos rápidos para agendar:</span>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" onclick="setSchedule(0)" class="text-[11px] font-mono px-2.5 py-1 bg-gray-100 dark:bg-zinc-800 hover:bg-black dark:hover:bg-zinc-100 hover:text-white dark:hover:text-black transition rounded-md text-gray-600 dark:text-zinc-300">
                                Publicar Agora
                            </button>
                            <button type="button" onclick="setSchedule(1)" class="text-[11px] font-mono px-2.5 py-1 bg-gray-100 dark:bg-zinc-800 hover:bg-black dark:hover:bg-zinc-100 hover:text-white dark:hover:text-black transition rounded-md text-gray-600 dark:text-zinc-300">
                                +1 Hora
                            </button>
                            <button type="button" onclick="setSchedule(24)" class="text-[11px] font-mono px-2.5 py-1 bg-gray-100 dark:bg-zinc-800 hover:bg-black dark:hover:bg-zinc-100 hover:text-white dark:hover:text-black transition rounded-md text-gray-600 dark:text-zinc-300">
                                Amanhã (mesmo horário)
                            </button>
                            <button type="button" onclick="setNextMonday()" class="text-[11px] font-mono px-2.5 py-1 bg-gray-100 dark:bg-zinc-800 hover:bg-black dark:hover:bg-zinc-100 hover:text-white dark:hover:text-black transition rounded-md text-gray-600 dark:text-zinc-300">
                                Próxima Segunda (09:00)
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-200 dark:border-zinc-800">
                <a href="/" class="px-4 py-2 text-xs font-mono text-gray-500 dark:text-zinc-400 hover:text-black dark:hover:text-zinc-100 transition">Cancelar</a>
                <button type="submit" class="bg-black dark:bg-zinc-100 text-white dark:text-black text-xs font-mono py-2 px-5 rounded-md hover:bg-gray-800 dark:hover:bg-zinc-200 transition">
                    Salvar Artigo
                </button>
            </div>
        </form>
    </main>
</div>

<!-- Footer -->
<footer class="mt-12 pt-6 border-t border-gray-100 dark:border-zinc-800 text-center text-[11px] text-gray-400 dark:text-zinc-500 font-mono">
    &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> marcosaraujo.dev
</footer>

<!-- Script JS Isolado -->
<script th:src="@{/js/post.js}"></script>

</body>
</html>

spring.application.name=marcosaraujo.dev

# ===================================
# CONFIGURAÇÃO DO SUPABASE (SEGURA)
# ===================================

# Se a variável de ambiente SUPABASE_DB_URL não existir, usa o fallback local
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASS:password}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração do Gemini API Key
gemini.api.key=${GEMINI_API_KEY}